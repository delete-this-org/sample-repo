name: release-deploy
# Triggered by a published release, never by a merge.
# NO REBUILD: the image already built for the release commit is re-tagged with
# the version, so PreProd and Prod run the exact bytes QA ran.
on:
  release:
    types: [published]

jobs:
  retag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The release tag points at release-please's "chore(main): release" commit,
      # which deploy.yml already built. Fail loudly if that image is missing
      # rather than silently promoting the wrong thing.
      - name: Verify the release commit's image exists
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository }}:sha-${GITHUB_SHA::7}

      - name: Re-tag the same digest with the release version
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }} \
            ghcr.io/${{ github.repository }}:sha-${GITHUB_SHA::7}

  deploy-preprod:
    needs: retag
    runs-on: ubuntu-latest
    environment: preprod          # ← release-managers approve
    steps:
      - uses: azure/login@v3
        with: { creds: ${{ secrets.AZURE_CREDENTIALS }} }
      - run: echo "deploy ${{ needs.retag.outputs.version }} to PREPROD"   # 🔧

  deploy-prod:
    needs: [retag, deploy-preprod]
    runs-on: ubuntu-latest
    environment: prod             # ← release-managers approve
    steps:
      - uses: azure/login@v3
        with: { creds: ${{ secrets.AZURE_CREDENTIALS }} }
      - run: echo "deploy ${{ needs.retag.outputs.version }} to PROD"      # 🔧
